<script>
        // System Data Registry Models
        let registeredPrograms = {};
        let registeredSections = {};
        let registeredFaculty = []; 
        let registeredRooms = [];
        let sharedSchedules = [];

        // Global Chart Registry Objects
        let collegeShareChartInstance = null;
        let workloadChartInstance = null;

        let matrixFilterScope = 'all';

        const defaultPrograms = {
            "COE": ["Bachelor of Science in Agricultural and Biosystems Engineering", "Bachelor of Science in Computer Engineering"],
            "CANS": ["Bachelor of Science in Agriculture", "Bachelor of Science in Agribusiness", "Bachelor of Science in Environmental Science"],
            "COEd": ["Bachelor of Elementary Education", "Bachelor of Secondary Education - English", "Bachelor of Secondary Education - Mathematics", "Bachelor of Secondary Education - Science", "Bachelor of Technology and Livelihood Education - HE", "Bachelor of Technology and Livelihood Education - ICT", "Bachelor of Early Childhood Education"],
            "CCS": ["Bachelor of Science in Computer Science", "Bachelor of Science in Information Technology"],
            "CAS": ["Bachelor of Arts in Communication", "Bachelor of Science in Biology"],
            "Graduate Studies": ["PhD", "MAED-EM", "MAED-Math", "MAM", "MATVE"]
        };

        const defaultSections = {
            "Bachelor of Science in Computer Engineering": ["BSCpE 1-1", "BSCpE III-1", "BSCpE IV-1"],
            "Bachelor of Science in Computer Science": ["BSCS III-1", "BSCS IV-1"],
            "Bachelor of Science in Information Technology": ["BSIT III-1", "BSIT III-2", "BSIT III-3"],
            "Bachelor of Science in Agricultural and Biosystems Engineering": ["BSABE III-2", "BSABE IV-1"]
        };

        const defaultFacultyRaw = ["Araneta, Arvin Anthony S.", "Lagramada, Alyssa Faye Y.", "Acebo, Joseph G.", "Ranido, Arvin Melson D.", "Alburo, Hershey R.", "Ecle, Cornelio Jeremy G.", "Duran, Archibald M.", "Arma, Leonilo A.", "Kuizon, Alma P.", "Lumagbas, Niño Laureano C.", "Bolito, Cherlowen A.", "Cabahug, Jose Mari C.", "Discar, Rheo C.", "Guial, Tessie A.", "Hermocilla, Emily O."];
        
        const defaultFaculty = defaultFacultyRaw.sort().map((name, i) => ({
            name: name,
            college: (name.includes("Araneta") || name.includes("Bolito") || name.includes("Cabahug")) ? "COE" : (i % 3 === 0 ? "CCS" : (i % 2 === 0 ? "COEd" : "CANS")),
            rank: i === 0 ? "TBA" : (i % 4 === 0 ? "Assistant Professor I" : (i % 5 === 0 ? "Associate Professor II" : "Instructor I")),
            designation: name.includes("Araneta") ? "Head" : (i % 6 === 0 ? "Dean" : (i % 7 === 0 ? "Coordinator / In-Charge" : "Without Designation"))
        }));

        const defaultRooms = ["COE-1", "COE-3", "COE-4", "COE-5", "COE-8", "COE-9", "COE-11", "COE-12", "CCS-1", "CCS-15", "CCS-16"].sort();
        
        const defaultSchedules = [
            { id: "3001", college: "COE", program: "Bachelor of Science in Computer Engineering", classSection: "BSCpE 1-1", subjectTitle: "Math 111 (Mathematics in the Modern World)", unifiedUnits: 3, instructorName: "Bolito, Cherlowen A.", dayAssignment: "Monday and Wednesday", startTime: "07:30", endTime: "09:00", roomNumber: "COE-1" },
            { id: "3002", college: "COE", program: "Bachelor of Science in Computer Engineering", classSection: "BSCpE III-1", subjectTitle: "CpE 311 (Logic Circuits and Design)", unifiedUnits: 4, instructorName: "Araneta, Arvin Anthony S.", dayAssignment: "Monday and Wednesday", startTime: "13:00", endTime: "16:00", roomNumber: "COE-3" }
        ];

        const designationUnitMinimums = {
            "Dean": 9, "Director": 9, "Head": 12, "Program Head": 12,
            "Coordinator / In-Charge": 15, "Without Designation": 18, "Lecturer": 18
        };

        function getDesignationBadgeStyles(designation) {
            const des = String(designation || '').trim();
            if (des === 'Dean' || des === 'Director') return 'bg-red-100 text-red-800 border border-red-200 font-extrabold shadow-sm';
            if (des === 'Head' || des === 'Program Head') return 'bg-purple-100 text-purple-800 border border-purple-200 font-bold';
            if (des === 'Coordinator / In-Charge') return 'bg-emerald-100 text-emerald-800 border border-emerald-200 font-semibold';
            if (des === 'Lecturer') return 'bg-amber-100 text-amber-800 border border-amber-200';
            return 'bg-gray-100 text-gray-700 border border-gray-200';
        }

        function convert24To12Hour(timeString) {
            if(!timeString || !timeString.includes(':')) return "";
            let [h, m] = timeString.split(':').map(Number);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; 
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')} ${ampm}`;
        }

        function getCollegeColorClass(collegeKey) {
            const key = String(collegeKey).toUpperCase();
            if (key === 'COED') return 'header-coed';
            if (key === 'COE') return 'header-coe';
            if (key === 'CANS') return 'header-cans';
            if (key === 'CCS') return 'header-ccs';
            if (key === 'CAS') return 'header-cas';
            if (key === 'GRADUATE STUDIES' || key === 'GS') return 'header-gs';
            return 'header-default';
        }

        function getCollegeHexCode(collegeKey) {
            const key = String(collegeKey).toUpperCase();
            if (key === 'COED') return [29, 78, 216];
            if (key === 'COE') return [127, 29, 29];
            if (key === 'CANS') return [63, 98, 18];
            if (key === 'CCS') return [107, 33, 168];
            if (key === 'CAS') return [13, 148, 136];
            if (key === 'GRADUATE STUDIES' || key === 'GS') return [7, 89, 133];
            return [30, 41, 59];
        }

        function getCollegeNormalizedStyleKey(collegeKey) {
            const key = String(collegeKey).toUpperCase();
            if (key === 'COED') return 'coed';
            if (key === 'COE') return 'coe';
            if (key === 'CANS') return 'cans';
            if (key === 'CCS') return 'ccs';
            if (key === 'CAS') return 'cas';
            if (key === 'GRADUATE STUDIES' || key === 'GS') return 'gs';
            return 'default';
        }

        function enforceProgramCollegeCorrections() {
            const targetProgram = "Bachelor of Science in Computer Engineering";
            let modified = false;

            // Remove BSCpE from CANS if cached there
            if (registeredPrograms["CANS"]) {
                const idx = registeredPrograms["CANS"].findIndex(p => p.toLowerCase() === targetProgram.toLowerCase());
                if (idx !== -1) {
                    registeredPrograms["CANS"].splice(idx, 1);
                    modified = true;
                }
            }

            // Ensure BSCpE is present under COE
            if (!registeredPrograms["COE"]) registeredPrograms["COE"] = [];
            if (!registeredPrograms["COE"].some(p => p.toLowerCase() === targetProgram.toLowerCase())) {
                registeredPrograms["COE"].push(targetProgram);
                modified = true;
            }

            // Reassign any existing schedule entries for BSCpE from CANS to COE
            sharedSchedules.forEach(s => {
                if (
                    (s.program && s.program.toLowerCase() === targetProgram.toLowerCase()) ||
                    (s.classSection && s.classSection.toUpperCase().includes("BSCPE"))
                ) {
                    if (s.college !== "COE") {
                        s.college = "COE";
                        s.program = targetProgram;
                        modified = true;
                    }
                }
            });

            if (modified) saveSystemStateToLocalStorage();
        }

        function initializeSystemStateHydration() {
            try {
                registeredPrograms = JSON.parse(localStorage.getItem("hub_registeredPrograms")) || defaultPrograms;
                registeredSections = JSON.parse(localStorage.getItem("hub_registeredSections")) || defaultSections;
                registeredFaculty = JSON.parse(localStorage.getItem("hub_registeredFaculty")) || defaultFaculty;
                registeredRooms = JSON.parse(localStorage.getItem("hub_registeredRooms")) || defaultRooms;
                sharedSchedules = JSON.parse(localStorage.getItem("hub_sharedSchedules")) || defaultSchedules;

                registeredFaculty.forEach(f => {
                    if (!f.college) f.college = "COE"; 
                    if (!f.rank) f.rank = "Instructor I";
                    if (!f.designation) f.designation = "Without Designation";
                });

                enforceProgramCollegeCorrections();
            } catch (err) {
                loadFactoryStateDefaults();
            }
        }

        function saveSystemStateToLocalStorage() {
            localStorage.setItem("hub_registeredPrograms", JSON.stringify(registeredPrograms));
            localStorage.setItem("hub_registeredSections", JSON.stringify(registeredSections));
            localStorage.setItem("hub_registeredFaculty", JSON.stringify(registeredFaculty));
            localStorage.setItem("hub_registeredRooms", JSON.stringify(registeredRooms));
            localStorage.setItem("hub_sharedSchedules", JSON.stringify(sharedSchedules));
        }

        function loadFactoryStateDefaults() {
            registeredPrograms = JSON.parse(JSON.stringify(defaultPrograms));
            registeredSections = JSON.parse(JSON.stringify(defaultSections));
            registeredFaculty = JSON.parse(JSON.stringify(defaultFaculty));
            registeredRooms = [...defaultRooms];
            sharedSchedules = JSON.parse(JSON.stringify(defaultSchedules));
            saveSystemStateToLocalStorage();
        }

        function purgeLocalStorageCache() {
            if (confirm("🚨 Clear local caches and structural datasets?")) {
                localStorage.clear();
                loadFactoryStateDefaults();
                executeRegistryDataSynchronization();
                switchTab('dashboard-view');
            }
        }

        let currentSummarySortMetric = 'units';
        let currentSummaryGroupingMode = 'none';

        function switchTab(tabId) {
            document.body.classList.remove('printing-matrix-active');
            document.getElementById('specializedMatrixPrintFrame').innerHTML = "";
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => { 
                el.className = "tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 pb-4 text-sm px-1 cursor-pointer"; 
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).className = "tab-btn border-b-2 border-blue-950 text-blue-950 font-bold pb-4 text-sm px-1 cursor-pointer";
            
            const matrixPanel = document.getElementById("matrixPrintingControlsPanel");
            if(matrixPanel) matrixPanel.classList.add("hidden");

            if(tabId === 'dashboard-view') renderDashboardCharts();
            if(tabId === 'program-schedule-view') { populateReportFilters(); renderProgramScheduleReport(); }
            if(tabId === 'workload-view') filterWorkloadFacultyDropdown();
            if(tabId === 'summary-view') {
                if (currentSummaryGroupingMode === 'matrix-tab') {
                    matrixPanel.classList.remove("hidden");
                }
                renderSummaryDashboard();
            }
            if(tabId === 'management-view') renderRegistryManagement();
        }

        function switchRegistryTab(subtabId) {
            document.querySelectorAll('.reg-panel').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.reg-tab-btn').forEach(el => { 
                el.className = "reg-tab-btn bg-gray-100 text-gray-700 text-xs px-4 py-2 rounded-lg cursor-pointer"; 
            });
            document.getElementById('panel-' + subtabId).classList.remove('hidden');
            document.getElementById('subtab-' + subtabId).className = "reg-tab-btn bg-blue-950 text-white text-xs font-bold px-4 py-2 rounded-lg cursor-pointer";
        }

        function refreshFormSelectors() {
            const el = document.getElementById("instructorSelect"); 
            if(!el) return;
            
            const fragment = document.createDocumentFragment();
            const defaultOpt = document.createElement("option");
            defaultOpt.value = "";
            defaultOpt.textContent = "Select Instructor...";
            fragment.appendChild(defaultOpt);

            registeredFaculty.forEach(x => { 
                const o = document.createElement("option"); 
                o.value = x.name; 
                o.textContent = `${x.name} [${x.college}] [${x.rank}] (${x.designation})`; 
                fragment.appendChild(o); 
            });
            el.innerHTML = "";
            el.appendChild(fragment);

            const rEl = document.getElementById("roomSelect"); 
            if(rEl) {
                const rFragment = document.createDocumentFragment();
                const rDefaultOpt = document.createElement("option");
                rDefaultOpt.value = "";
                rDefaultOpt.textContent = "Select Room Layout...";
                rFragment.appendChild(rDefaultOpt);

                registeredRooms.forEach(x => { 
                    const o = document.createElement("option"); 
                    o.value = x; 
                    o.textContent = x; 
                    rFragment.appendChild(o); 
                });
                rEl.innerHTML = "";
                rEl.appendChild(rFragment);
            }
            populateEncoderPrograms();
        }

        function populateEncoderPrograms() {
            const col = document.getElementById("collegeSelect").value;
            const el = document.getElementById("programSelect"); 
            if(!el) return;
            el.innerHTML = '<option value="">Select a Course</option>';
            if(col && registeredPrograms[col]) {
                const fragment = document.createDocumentFragment();
                registeredPrograms[col].forEach(p => { 
                    const o = document.createElement("option"); 
                    o.value = p; o.textContent = p; 
                    fragment.appendChild(o); 
                });
                el.appendChild(fragment);
            }
            populateEncoderSections();
        }

        function populateEncoderSections() {
            const prog = document.getElementById("programSelect").value;
            const el = document.getElementById("classSectionSelect"); 
            if(!el) return;
            el.innerHTML = '<option value="">Select Section</option>';
            if(prog && registeredSections[prog]) {
                const fragment = document.createDocumentFragment();
                [...registeredSections[prog]].sort().forEach(s => { 
                    const o = document.createElement("option"); 
                    o.value = s; o.textContent = s; 
                    fragment.appendChild(o); 
                });
                el.appendChild(fragment);
            }
        }

        function calculateWeeklyHours(day, s, e) {
            if (!s || !e) return 0; 
            const [sh, sm] = s.split(':').map(Number); 
            const [eh, em] = e.split(':').map(Number);
            return parseFloat((((eh * 60 + em) - (sh * 60 + sm)) / 60 * (day.toLowerCase().includes("and") ? 2 : 1)).toFixed(2));
        }

        function toMins(t) { 
            const [h, m] = t.split(':').map(Number); 
            return h * 60 + m; 
        }

        function handleCSVFileLoad(ev) {
            const f = ev.target.files[0]; 
            if (!f) return; 
            const r = new FileReader();
            r.onload = function(e) { document.getElementById("rawSchedulePasteInput").value = e.target.result; }; 
            r.readAsText(f);
        }

        function processUploadedScheduleText() {
            const selectedCollege = document.getElementById("uploadCollegeSelect").value;
            const txt = document.getElementById("rawSchedulePasteInput").value;
            if(!selectedCollege || !txt.trim()) { alert("⚠️ Configuration Target Division Missing!"); return; }

            const lines = txt.split(/\r?\n/);
            let parsedCount = 0;
            
            const facultyMapCache = new Map(registeredFaculty.map(f => [f.name.toLowerCase(), f]));

            for(let i=0; i < lines.length; i++) {
                let segment = lines[i].trim(); if(!segment) continue;
                let tokens = segment.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(t => t.replace(/^"|"$|\\r|\\n/g, '').trim());

                if(tokens.length >= 4) {
                    let section = tokens[0] || "General Section";
                    let dayTimeBlock = tokens[1] || "";
                    let subjectTitle = tokens[2] || "";
                    let units = parseInt(tokens[3]) || 3;
                    let instructor = tokens[4] || "Instructor Unassigned";
                    let room = tokens[5] ? tokens[5].replace(/"/g, '') : "General Room";

                    if(section.toUpperCase().includes("SECTION") || section.toUpperCase().includes("DAY/TIME")) continue;

                    let resolvedCollege = selectedCollege;
                    let assignedProgram = (registeredPrograms[resolvedCollege] && registeredPrograms[resolvedCollege][0]) || "General Program"; 
                    let upperSection = section.toUpperCase();

                    // Auto-route BSCpE to COE even if CANS was selected in the dropdown
                    if (upperSection.includes("BSCPE") || upperSection.includes("CPE")) {
                        resolvedCollege = "COE";
                        assignedProgram = "Bachelor of Science in Computer Engineering";
                    } else if (resolvedCollege === "COE") {
                        if(upperSection.includes("BSABE") || upperSection.includes("ABE")) assignedProgram = "Bachelor of Science in Agricultural and Biosystems Engineering";
                    } else if (resolvedCollege === "CCS") {
                        if(upperSection.includes("BSCS") || upperSection.includes("CS")) assignedProgram = "Bachelor of Science in Computer Science";
                        else if(upperSection.includes("BSIT") || upperSection.includes("IT")) assignedProgram = "Bachelor of Science in Information Technology";
                    }

                    if(!registeredSections[assignedProgram]) registeredSections[assignedProgram] = [];
                    if(!registeredSections[assignedProgram].includes(section)) registeredSections[assignedProgram].push(section);

                    let dayAssignment = "Monday", startTime = "08:00", endTime = "11:00";
                    const dayMatches = dayTimeBlock.match(/(Monday\s+and\s+Wednesday|Tuesday\s+and\s+Thursday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)/i);
                    if(dayMatches) dayAssignment = dayMatches[1].trim();

                    const timeMatches = dayTimeBlock.match(/(\d{1,2}:\d{2})\s*(AM|PM)?\s*[-–]\s*(\d{1,2}:\d{2})\s*(AM|PM)?/i);
                    if(timeMatches) { 
                        let startRaw = timeMatches[1]; let startAmpm = timeMatches[2];
                        let endRaw = timeMatches[3]; let endAmpm = timeMatches[4];
                        startTime = convertTo24Hour(startAmpm ? `${startRaw} ${startAmpm}` : startRaw); 
                        endTime = convertTo24Hour(endAmpm ? `${endRaw} ${endAmpm}` : endRaw); 
                    }

                    let matchFaculty = facultyMapCache.get(instructor.toLowerCase());
                    let matchFacultyName = matchFaculty ? matchFaculty.name : instructor;
                    
                    if(!matchFaculty) {
                        const newFaculty = { name: instructor, college: resolvedCollege, rank: "TBA", designation: "Without Designation" };
                        registeredFaculty.push(newFaculty);
                        facultyMapCache.set(instructor.toLowerCase(), newFaculty);
                    }
                    if(!registeredRooms.includes(room)) registeredRooms.push(room);

                    sharedSchedules.push({
                        id: `sched-${Date.now()}-${Math.floor(Math.random() * 100000)}`, college: resolvedCollege, program: assignedProgram, classSection: section,
                        subjectTitle: subjectTitle, unifiedUnits: units, instructorName: matchFacultyName, dayAssignment: dayAssignment,
                        startTime: startTime, endTime: endTime, roomNumber: room
                    });
                    parsedCount++;
                }
            }
            
            saveSystemStateToLocalStorage();
            executeRegistryDataSynchronization();
            alert(`✅ Ingestion Complete! Merged entry expanded by ${parsedCount} lines.`);
            switchTab('dashboard-view');
        }

        function fontFacultyClassesChronologically(list) {
            const weights = { "monday": 1, "tuesday": 2, "wednesday": 3, "thursday": 4, "friday": 5, "saturday": 6, "monday and wednesday": 1.5, "tuesday and thursday": 2.5 };
            return list.sort((a, b) => (weights[a.dayAssignment.toLowerCase()] || 7) - (weights[b.dayAssignment.toLowerCase()] || 7) || toMins(a.startTime) - toMins(b.startTime));
        }

        function renderDashboardCharts() {
            const totalSchedules = sharedSchedules.length;
            const totalFacultyCount = registeredFaculty.length;
            const dataset = getAggregatedFacultyMetricsList(); 
            
            let totalUnits = 0; let compliantCount = 0; let nonCompliantCount = 0; let totalAuditedFaculty = 0;
            const distinctUndergradCourses = new Set();
            const classroomsPerCollege = { "COE": new Set(), "CCS": new Set(), "COEd": new Set(), "CANS": new Set(), "CAS": new Set(), "Graduate Studies": new Set() };

            const collegeAudit = {
                "COE": { compliant: 0, nonCompliant: 0, topFaculty: null, maxUnits: -1, maxHours: -1, underloadedList: [] },
                "CCS": { compliant: 0, nonCompliant: 0, topFaculty: null, maxUnits: -1, maxHours: -1, underloadedList: [] },
                "COEd": { compliant: 0, nonCompliant: 0, topFaculty: null, maxUnits: -1, maxHours: -1, underloadedList: [] },
                "CANS": { compliant: 0, nonCompliant: 0, topFaculty: null, maxUnits: -1, maxHours: -1, underloadedList: [] },
                "CAS": { compliant: 0, nonCompliant: 0, topFaculty: null, maxUnits: -1, maxHours: -1, underloadedList: [] },
                "Graduate Studies": { compliant: 0, nonCompliant: 0, topFaculty: null, maxUnits: -1, maxHours: -1, underloadedList: [] }
            };

            sharedSchedules.forEach(s => {
                if (s.college !== "Graduate Studies" && s.subjectTitle) {
                    distinctUndergradCourses.add(s.subjectTitle.split('(')[0].trim());
                }
                if (s.college && classroomsPerCollege.hasOwnProperty(s.college) && s.roomNumber) {
                    classroomsPerCollege[s.college].add(s.roomNumber);
                }
            });

            document.getElementById("kpi-undergrad-courses").textContent = distinctUndergradCourses.size;
            
            const classroomsDeckContainer = document.getElementById("dashboard-classrooms-college-deck");
            if (classroomsDeckContainer) {
                classroomsDeckContainer.innerHTML = Object.keys(classroomsPerCollege).map(colKey => {
                    const styleKey = getCollegeNormalizedStyleKey(colKey);
                    return `
                        <div class="p-2 border border-gray-100 rounded-lg bg-${styleKey}-soft text-center flex flex-col justify-center">
                            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wide truncate block">${colKey}</span>
                            <span class="text-lg font-black text-${styleKey} mt-0.5">${classroomsPerCollege[colKey].size} <span class="text-[10px] font-medium text-gray-400">Rms</span></span>
                        </div>
                    `;
                }).join('');
            }
            
            dataset.forEach(f => {
                totalUnits += f.units;
                if (f.rank === "TBA") return;
                
                totalAuditedFaculty++;
                const minReq = designationUnitMinimums[f.designation] || 18;
                const isCompliant = (f.units >= minReq) || (f.hours >= 20);

                if (isCompliant) compliantCount++; else nonCompliantCount++;

                const homeColKey = f.homeCollege;
                if (collegeAudit.hasOwnProperty(homeColKey)) {
                    if (isCompliant) {
                        collegeAudit[homeColKey].compliant++;
                        if (f.units > collegeAudit[homeColKey].maxUnits || (f.units === collegeAudit[homeColKey].maxUnits && f.hours > collegeAudit[homeColKey].maxHours)) {
                            collegeAudit[homeColKey].maxUnits = f.units;
                            collegeAudit[homeColKey].maxHours = f.hours;
                            collegeAudit[homeColKey].topFaculty = f;
                        }
                    } else {
                        collegeAudit[homeColKey].nonCompliant++;
                        collegeAudit[homeColKey].underloadedList.push({
                            name: f.name, rank: f.rank, units: f.units, hours: f.hours, target: minReq, deficit: minReq - f.units
                        });
                    }
                }
            });
            
            document.getElementById("kpi-total-schedules").textContent = totalSchedules;
            document.getElementById("kpi-total-faculty").textContent = totalFacultyCount;
            document.getElementById("kpi-total-units").textContent = totalUnits + " Unit/s";
            
            const compliancePercent = totalAuditedFaculty > 0 ? Math.round((compliantCount / totalAuditedFaculty) * 100) : 100;
            document.getElementById("kpi-compliance-rate").textContent = compliancePercent + "%";
            
            const tableBody = document.getElementById("dashboard-college-compliance-table-body");
            if (tableBody) {
                tableBody.innerHTML = Object.keys(collegeAudit).map(col => `
                    <tr class="hover:bg-gray-50/60">
                        <td class="p-2.5 font-bold text-gray-700">${col}</td>
                        <td class="p-2.5 text-center font-bold text-emerald-600 bg-emerald-50/30">${collegeAudit[col].compliant}</td>
                        <td class="p-2.5 text-center font-bold text-red-500 bg-red-50/30">${collegeAudit[col].nonCompliant}</td>
                    </tr>
                `).join('');
            }

            const nonCompliantContainer = document.getElementById("dashboard-non-compliant-faculty-container");
            if (nonCompliantContainer) {
                let htmlElementsBuffer = [];
                Object.keys(collegeAudit).forEach(col => {
                    const styleKey = getCollegeNormalizedStyleKey(col);
                    collegeAudit[col].underloadedList.forEach(f => {
                        htmlElementsBuffer.push(`
                            <div class="p-3 border-l-4 border bg-white rounded-xl shadow-sm border-${styleKey} bg-${styleKey}-soft flex flex-col justify-between space-y-2">
                                <div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded text-white header-${styleKey}">${col}</span>
                                        <span class="text-[10px] font-mono font-bold text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-100">Deficit: -${f.deficit} U</span>
                                    </div>
                                    <div class="text-xs font-bold text-gray-900 mt-2 truncate">${f.name}</div>
                                    <div class="text-[10px] text-gray-500 truncate mt-0.5">${f.rank}</div>
                                </div>
                                <div class="bg-white/80 backdrop-blur-sm border border-gray-100 rounded-lg px-2 py-1.5 flex justify-between items-center text-[11px] font-medium mt-1">
                                    <span class="text-gray-500">Load: <strong class="text-gray-900">${f.units} U / ${f.hours.toFixed(1)} h</strong></span>
                                    <span class="text-gray-300">|</span>
                                    <span class="text-gray-500">Req: <strong class="text-${styleKey} font-bold">${f.target} U</strong></span>
                                </div>
                            </div>
                        `);
                    });
                });

        function exportFacultyRosterCSV() {
            if (registeredFaculty.length === 0) { alert("Roster dataset records are currently empty."); return; }
            const cleanEscape = (str) => {
                let text = String(str || '').replace(/"/g, '""').trim();
                return text.includes(',') ? `"${text}"` : text;
            };
            let csvLines = [["Faculty Full Name", "College Department", "Academic Rank", "Designation Role"].join(",")];
            registeredFaculty.forEach(f => {
                csvLines.push([cleanEscape(f.name), cleanEscape(f.college), cleanEscape(f.rank), cleanEscape(f.designation)].join(","));
            });
            const blob = new Blob([csvLines.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "ESSU_Salcedo_Faculty_Roster_Backup.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function importFacultyRosterCSV(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const rows = e.target.result.split(/\r?\n/);
                rows.forEach(row => {
                    const cleanLine = row.trim(); if (!cleanLine) return;
                    const cells = cleanLine.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                    if (cells.length >= 4 && !cells[0].toLowerCase().includes("faculty full name")) {
                        const existingMatchIndex = registeredFaculty.findIndex(f => f.name.toLowerCase() === cells[0].toLowerCase());
                        const profileModel = { name: cells[0], college: cells[1], rank: cells[2], designation: cells[3] };
                        if (existingMatchIndex !== -1) registeredFaculty[existingMatchIndex] = profileModel;
                        else registeredFaculty.push(profileModel);
                    }
                });
                registeredFaculty.sort((a, b) => a.name.localeCompare(b.name));
                saveSystemStateToLocalStorage(); executeRegistryDataSynchronization();
                alert(`✅ Faculty Data Synchronization Finished!`);
                event.target.value = ""; 
            };
            reader.readAsText(file);
        }

        function exportCollegeCSV(collegeKey) {
            const records = sharedSchedules.filter(s => s.college === collegeKey);
            if (records.length === 0) { alert("No schedule records available to build a data package."); return; }
            const escapeStr = (str) => {
                let cleaned = String(str || '').replace(/"/g, '""');
                return cleaned.includes(',') ? `"${cleaned}"` : cleaned;
            };
            const csvRows = records.map(r => [
                escapeStr(r.classSection), escapeStr(`${r.dayAssignment} (${convert24To12Hour(r.startTime)}-${convert24To12Hour(r.endTime)})`),
                escapeStr(r.subjectTitle), r.unifiedUnits, escapeStr(r.instructorName), escapeStr(r.roomNumber)
            ].join(','));

            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Ingestion_Template_${String(collegeKey).replace(/[^a-zA-Z0-9]/g, "_")}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

                if(mode === 'faculty') { 
                    const collegeDeptVal = document.getElementById("regFacultyInputCollege").value;
                    const rankVal = document.getElementById("regInputRank").value;
                    const des = document.getElementById("regInputDesignation").value;
                    if(!registeredFaculty.some(f => f.name === inputVal)) {
                        registeredFaculty.push({ name: inputVal, college: collegeDeptVal, rank: rankVal, designation: des });
                    } 
                } else if(mode === 'room') { 
                    if(!registeredRooms.includes(inputVal)) registeredRooms.push(inputVal); 
                } else if(mode === 'program') {
                    const col = document.getElementById("regInputCollege").value;
                    if(!registeredPrograms[col].includes(inputVal)) registeredPrograms[col].push(inputVal);
                } else if(mode === 'section') {
                    const prog = document.getElementById("regInputProgram").value;
                    if(!registeredSections[prog]) registeredSections[prog] = [];
                    if(!registeredSections[prog].includes(inputVal)) registeredSections[prog].push(inputVal);
                }
            } else if(action === "EDIT") {
                const parentKey = document.getElementById("regOldKey").value;
                const index = parseInt(document.getElementById("regOldIndex").value);

                if(mode === 'faculty') {
                    let oldName = registeredFaculty[index].name;
                    registeredFaculty[index].name = inputVal;
                    registeredFaculty[index].college = document.getElementById("regFacultyInputCollege").value;
                    registeredFaculty[index].rank = document.getElementById("regInputRank").value;
                    registeredFaculty[index].designation = document.getElementById("regInputDesignation").value;
                    sharedSchedules.forEach(s => { if(s.instructorName === oldName) s.instructorName = inputVal; });
                } else if(mode === 'room') {
                    let oldRoom = registeredRooms[index]; registeredRooms[index] = inputVal;
                    sharedSchedules.forEach(s => { if(s.roomNumber === oldRoom) s.roomNumber = inputVal; });
                } else if(mode === 'program') {
                    let oldProg = registeredPrograms[parentKey][index]; registeredPrograms[parentKey][index] = inputVal;
                    if(registeredSections[oldProg]) { registeredSections[inputVal] = registeredSections[oldProg]; delete registeredSections[oldProg]; }
                    sharedSchedules.forEach(s => { if(s.program === oldProg) s.program = inputVal; });
                } else if(mode === 'section') {
                    let oldSect = registeredSections[parentKey][index];
                    const targetProgKey = document.getElementById("regInputProgram").value;
                    registeredSections[parentKey].splice(index, 1);
                    if(!registeredSections[targetProgKey]) registeredSections[targetProgKey] = [];
                    registeredSections[targetProgKey].push(inputVal);

                    sharedSchedules.forEach(s => { 
                        if(s.program === parentKey && s.classSection === oldSect) { s.classSection = inputVal; s.program = targetProgKey; }
                    });
                }
            }

            registeredFaculty.sort((a,b) => a.name.localeCompare(b.name)); 
            registeredRooms.sort(); saveSystemStateToLocalStorage();
            closeRegistryGlobalModal(); executeRegistryDataSynchronization();
        });

        function deleteRegistryRow(mode, parentKey, index) {
            if(!confirm(`Are you sure you want to delete this ${mode} entry?`)) return;
            if(mode === 'faculty') registeredFaculty.splice(index, 1);
            else if(mode === 'room') registeredRooms.splice(index, 1);
            else if(mode === 'program') registeredPrograms[parentKey].splice(index, 1);
            else if(mode === 'section') registeredSections[parentKey].splice(index, 1);
            saveSystemStateToLocalStorage(); executeRegistryDataSynchronization();
        }

        function closeRegistryGlobalModal() { document.getElementById("registryGlobalModal").classList.add("hidden"); }
        function closeScheduleEditorModal() { document.getElementById("scheduleUpdateModal").classList.add("hidden"); }
        
        function changeSummaryGrouping(mode) { 
            currentSummaryGroupingMode = mode; 
            
            const printingPanel = document.getElementById("matrixPrintingControlsPanel");
            if (printingPanel) {
                if (mode === 'matrix-tab') printingPanel.classList.remove("hidden");
                else printingPanel.classList.add("hidden");
            }

            changeSummarySort(currentSummarySortMetric); 
        }
        
        function changeSummarySort(m) { currentSummarySortMetric = m; renderSummaryDashboard(); }

        function filterMatrixView(scopeType) {
            matrixFilterScope = scopeType;
            
            const subButtons = ['matrix-filter-program', 'matrix-filter-compliant', 'matrix-filter-noncompliant', 'matrix-filter-all'];
            subButtons.forEach(btnId => {
                const el = document.getElementById(btnId);
                if(!el) return;
                el.classList.remove("ring-2", "ring-indigo-400");
            });

            if (scopeType === 'all') {
                document.getElementById("matrixCollegeScopeDropdown").value = "all-colleges";
                document.getElementById("matrix-filter-all").classList.add("ring-2", "ring-indigo-400");
            } else if (scopeType === 'program') {
                document.getElementById("matrix-filter-program").classList.add("ring-2", "ring-indigo-400");
            } else if (scopeType === 'compliant') {
                document.getElementById("matrix-filter-compliant").classList.add("ring-2", "ring-indigo-400");
            } else if (scopeType === 'non-compliant') {
                document.getElementById("matrix-filter-noncompliant").classList.add("ring-2", "ring-indigo-400");
            }

            renderSummaryDashboard();
        }

        function handleMatrixDropdownCollegeChange(dropdownValue) {
            if (dropdownValue === 'all-colleges') {
                matrixFilterScope = 'all';
            } else {
                matrixFilterScope = dropdownValue;
            }
            renderSummaryDashboard();
        }

        function getAggregatedFacultyMetricsList() {
            return registeredFaculty.map(p => {
                const cl = sharedSchedules.filter(s => s.instructorName === p.name); 
                let u = 0, h = 0; const pr = new Set(); const progs = new Set(); const subjectsList = [];
                
                cl.forEach(c => { 
                    u += c.unifiedUnits; 
                    h += calculateWeeklyHours(c.dayAssignment, c.startTime, c.endTime); 
                    pr.add(c.subjectTitle); if(c.program) progs.add(c.program);
                    subjectsList.push(c.subjectTitle);
                });

                return { 
                    name: p.name, homeCollege: p.college || "COE", rank: p.rank || 'Instructor I', 
                    designation: p.designation || 'Without Designation', units: u, hours: h, 
                    prepsCount: pr.size, programs: Array.from(progs), subjects: subjectsList
                };
            }).filter(x => x.units > 0 || x.designation !== 'Without Designation');
        }

        function createSummaryComplianceBadgeHTML(units, hours, designation, rank) {
            if (rank === "TBA") return `<span class="bg-gray-100 text-gray-500 text-[10px] font-bold px-2 py-0.5 rounded ml-2"> Bypassed (TBA Rank)</span>`;
            const requiredUnits = designationUnitMinimums[designation] || 18;
            if (units >= requiredUnits) return `<span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded ml-2">✓ OK (Units Compliant)</span>`;
            if (hours >= 20) return `<span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded ml-2">✓ OK (Hours Override)</span>`;
            return `<span class="bg-red-100 text-red-800 text-[10px] font-bold px-2 py-0.5 rounded ml-2">⚠️ Standard Shortfall (-${requiredUnits - units} U)</span>`;
        }

                                    (collegeScope === "ALL" ? registeredFaculty.map(f => f.name).sort() : registeredFaculty.filter(f => f.college === collegeScope).map(f => f.name).sort());

            }).join('');

        function exportFacultySummaryExcelGrouped() {
            let dataset = getAggregatedFacultyMetricsList(); if(dataset.length === 0) return;
            let wb = XLSX.utils.book_new();

            if (currentSummaryGroupingMode === 'none' || currentSummaryGroupingMode === 'matrix-tab') {
                let dataRows = dataset.map(f => ({ "Faculty Name": f.name, "Department College": f.homeCollege, "Academic Rank": f.rank, "Designation Assignment": f.designation, "Total Workload Unit/s": f.units, "Weekly Committed Hours": f.hours, "Distinct Preparations Count": f.prepsCount }));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataRows), "Flat Load List");
            } else if (currentSummaryGroupingMode === 'college') {
                ["COE", "CCS", "COEd", "CANS", "CAS", "Graduate Studies"].forEach(college => {
                    let rows = dataset.filter(f => f.homeCollege === college); if (rows.length === 0) return;
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.map(f => ({ "Instructor": f.name, "Rank": f.rank, "Designation": f.designation, "Assigned Unit/s": f.units, "Weekly Hours": f.hours }))), college.substring(0, 31));
                });
            } else if (currentSummaryGroupingMode === 'program') {
                let indexCounter = 1;
                Object.keys(registeredPrograms).forEach(col => {
                    registeredPrograms[col].forEach(prog => {
                        let rows = dataset.filter(f => f.programs.includes(prog)); if (rows.length === 0) return;
                        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.map(f => ({ "Instructor Name": f.name, "Home College": f.homeCollege, "Rank": f.rank, "Designation": f.designation, "Unit/s": f.units, "Hours": f.hours }))), `${indexCounter++}-${prog.replace(/[^a-zA-Z0-9\s]/g, "").substring(0, 25)}`);
                    });
                });
            }
            XLSX.writeFile(wb, `Faculty_Load_Summary_${currentSummaryGroupingMode}.xlsx`);
        }

        function triggerWorkloadExport(formatType) {
            const targetScope = document.getElementById("workloadScopeSelector").value;
            const singleSelectedFaculty = document.getElementById("facultySelector").value;
            const collegeScope = document.getElementById("facultyWorkloadCollegeScope").value;

            let workloadMap = []; let facultyScopeList = registeredFaculty.filter(f => collegeScope === "ALL" || f.college === collegeScope).map(f => f.name).sort();

            if (targetScope === "current") {
                if(singleSelectedFaculty !== "ALL") facultyScopeList = [singleSelectedFaculty];
                workloadMap.push({ titleId: "Selected_Workloads", members: facultyScopeList });
            } else if (targetScope === "all") {
                workloadMap.push({ titleId: "University_As_A_Whole_Workloads", members: facultyScopeList });
            } else if (targetScope === "college") {
                ["COE", "CCS", "COEd", "CANS", "CAS", "Graduate Studies"].forEach(colKey => {
                    let filteredMembers = registeredFaculty.filter(f => f.college === colKey).map(f => f.name);
                    if(filteredMembers.length > 0) workloadMap.push({ titleId: `College_${colKey}_Workloads`, members: filteredMembers });
                });
            } else if (targetScope === "program") {
                Object.keys(registeredPrograms).forEach(colKey => {
                    registeredPrograms[colKey].forEach(progKey => {
                        let filteredMembers = facultyScopeList.filter(fName => sharedSchedules.some(s => s.instructorName === fName && s.program === progKey));
                        if(filteredMembers.length > 0) workloadMap.push({ titleId: `Program_${progKey.replace(/[^a-zA-Z0-9]/g, "_").substring(0, 30)}`, members: filteredMembers });
                    });
                });
            }

            if (formatType === 'pdf') generateAutomatedWorkloadPDF(workloadMap);
            if (formatType === 'xlsx') generateAutomatedWorkloadExcel(workloadMap);
            if (formatType === 'docx') generateAutomatedWorkloadWord(workloadMap);
        }

        function docAutoTableShim(doc, options) {
            if (typeof doc.autoTable === 'function') {
                doc.autoTable(options);
            } else if (window.jspdf && window.jspdf.jsPDF && typeof window.jspdf.jsPDF.API.autoTable === 'function') {
                doc.autoTable(options);
            } else {
                console.error("jsPDF autotable plugin is missing or incorrectly mapped.");
            }
        }

        function generateAutomatedWorkloadPDF(workloadMap) {
            const { jsPDF } = window.jspdf;
            workloadMap.forEach(packageItem => {
                const doc = new jsPDF('p', 'mm', 'a4'); let matchesAdded = 0;
                packageItem.members.forEach(prof => {
                    let clList = sharedSchedules.filter(s => s.instructorName === prof); if (clList.length === 0) return;
                    if (matchesAdded > 0) doc.addPage(); matchesAdded++;

                    let classes = fontFacultyClassesChronologically(clList);
                    let preps = new Set(classes.map(c => c.subjectTitle)).size;
                    let facObj = registeredFaculty.find(f => f.name === prof) || { name: prof, college: "COE", rank: "Instructor I", designation: "Without Designation" };

                    doc.setFontSize(14); doc.text("INDIVIDUAL FACULTY WORKLOAD SHEET", 105, 15, { align: "center" });
                    doc.setFontSize(10); doc.text(`Faculty Member: ${prof} | Dept: ${facObj.college} | Rank: ${facObj.rank} | Role: ${facObj.designation} | Preparations: ${preps}`, 14, 23);

                    let totU = 0, totH = 0;
                    let tableBody = classes.map(c => {
                        let hrs = calculateWeeklyHours(c.dayAssignment, c.startTime, c.endTime); totU += c.unifiedUnits; totH += hrs;
                        return [`${c.dayAssignment}\n(${convert24To12Hour(c.startTime)}\n-${convert24To12Hour(c.endTime)})`, c.subjectTitle, c.unifiedUnits, hrs.toFixed(1), c.classSection, c.roomNumber];
                    });
                    tableBody.push([{ text: 'Totals Compliance:', colSpan: 2, styles: { fontStyle: 'bold', halign: 'right' } }, '', totU, totH.toFixed(1), '', '']);
                    docAutoTableShim(doc, { startY: 27, head: [['Day / Time Assignment', 'Subject Descriptive Title', 'Unit/s', 'Hrs/Wk', 'Class', 'Room']], body: tableBody, theme: 'grid', headStyles: { fillColor: [20, 30, 60] } });
                });
                if(matchesAdded > 0) doc.save(`${packageItem.titleId}.pdf`);
            });
        }

        function generateAutomatedWorkloadExcel(workloadMap) {
            workloadMap.forEach(packageItem => {
                let wb = XLSX.utils.book_new();
                packageItem.members.forEach(prof => {
                    let clList = sharedSchedules.filter(s => s.instructorName === prof); if (clList.length === 0) return;
                    let classes = fontFacultyClassesChronologically(clList);
                    let facObj = registeredFaculty.find(f => f.name === prof) || { name: prof, college: "COE", rank: "Instructor I", designation: "Without Designation" };
                    let matrixData = [
                        ["INDIVIDUAL FACULTY WORKLOAD SHEET"], ["Academic Year 2026 - 2027 Summary Allocation Blueprint"], [],
                        ["Faculty Member Name:", prof, "Academic Rank:", facObj.rank, "Designation:", facObj.designation, "Department:", facObj.college], [],
                        ["Day / Time Assignment", "Subject Code & Description", "Course Unit/s", "Hours per Week", "Section Block", "Room Layout"]
                    ];
                    let subUnits = 0, subHrs = 0;
                    classes.forEach(c => {
                        let hrs = calculateWeeklyHours(c.dayAssignment, c.startTime, c.endTime); subUnits += c.unifiedUnits; subHrs += hrs;
                        matrixData.push([`${c.dayAssignment} (${convert24To12Hour(c.startTime)} - ${convert24To12Hour(c.endTime)})`, c.subjectTitle, c.unifiedUnits, hrs, c.classSection, c.roomNumber]);
                    });
                    matrixData.push([], ["TOTALS:", "", subUnits, subHrs, "", ""]);
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(matrixData), prof.replace(/[^a-zA-Z0-9]/g, "").substring(0, 30));
                });
                XLSX.writeFile(wb, `${packageItem.titleId}.xlsx`);
            });
        }

        function generateAutomatedWorkloadWord(workloadMap) {
            const { Document, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType } = window.docx;
            workloadMap.forEach(packageItem => {
                let sectionChildren = [];
                packageItem.members.forEach(prof => {
                    let clList = sharedSchedules.filter(s => s.instructorName === prof); if (clList.length === 0) return;
                    let classes = fontFacultyClassesChronologically(clList);
                    let facObj = registeredFaculty.find(f => f.name === prof) || { name: prof, college: "COE", rank: "Instructor I", designation: "Without Designation" };
                    sectionChildren.push(
                        new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "INDIVIDUAL FACULTY WORKLOAD SHEET", bold: true, size: 28 })] }),
                        new Paragraph({ text: "" }), new Paragraph({ children: [new TextRun({ text: `Faculty Member: ${prof} | College Dept: ${facObj.college} | Rank: ${facObj.rank} | Designation: ${facObj.designation}`, bold: true })] }), new Paragraph({ text: "" })
                    );
                    let tableHeaderCells = ["Day / Time", "Subject Descriptive Title", "Unit/s", "Hrs/Wk", "Class Section", "Room"].map(x => new TableCell({ children: [new Paragraph({ text: x, style: "bold" })] }));
                    let rowElementsList = [new TableRow({ children: tableHeaderCells })];
                    let totalUnitsCount = 0, totalHoursCount = 0;

                    classes.forEach(c => {
                        let hrs = calculateWeeklyHours(c.dayAssignment, c.startTime, c.endTime); totalUnitsCount += c.unifiedUnits; totalHoursCount += hrs;
                        rowElementsList.push(new TableRow({ children: [`${c.dayAssignment} (${convert24To12Hour(c.startTime)} - ${convert24To12Hour(c.endTime)})`, c.subjectTitle, c.unifiedUnits.toString(), hrs.toFixed(1), c.classSection, c.roomNumber].map(val => new TableCell({ children: [new Paragraph(val)] })) }));
                    });
                    rowElementsList.push(new TableRow({ children: [new TableCell({ children: [new Paragraph({ text: "TOTAL COMPILATIONS:", style: "bold" })], columnSpan: 2 }), new TableCell({ children: [new Paragraph(totalUnitsCount.toString())] }), new TableCell({ children: [new Paragraph(totalHoursCount.toFixed(1))] }), new TableCell({ children: [], columnSpan: 2 })] }));
                    sectionChildren.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: rowElementsList }));
                    sectionChildren.push(new Paragraph({ text: "", pageBreakBefore: true }));
                });
                if(sectionChildren.length === 0) return; sectionChildren.pop();
                let doc = new Document({ sections: [{ children: sectionChildren }] });
                window.docx.Packer.toBlob(doc).then(blob => {
                    let link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `${packageItem.titleId}.docx`; link.click();
                });
            });
        }

        function rebuildStateStructuralRegistriesFromSchedules() {
            enforceProgramCollegeCorrections();
            sharedSchedules.forEach(s => {
                if(s.college && s.program) {
                    if(!registeredPrograms[s.college]) registeredPrograms[s.college] = [];
                    if(!registeredPrograms[s.college].includes(s.program)) registeredPrograms[s.college].push(s.program);
                }
                if(s.program && s.classSection) {
                    if(!registeredSections[s.program]) registeredSections[s.program] = [];
                    if(!registeredSections[s.program].includes(s.classSection)) registeredSections[s.program].push(s.classSection);
                }
                if(s.instructorName && !registeredFaculty.some(f => f.name === s.instructorName)) {
                    registeredFaculty.push({ name: s.instructorName, college: s.college || "COE", rank: "TBA", designation: "Without Designation" });
                }
                if(s.roomNumber && !registeredRooms.includes(s.roomNumber)) registeredRooms.push(s.roomNumber);
            });
        }

        function executeRegistryDataSynchronization() {
            rebuildStateStructuralRegistriesFromSchedules();
            refreshFormSelectors(); renderRegistryManagement(); renderMasterSchedule(); renderSummaryDashboard(); updateFacultySelector(); renderWorkloads();
            
            if(!document.getElementById("program-schedule-view").classList.contains("hidden")) { populateReportFilters(); renderProgramScheduleReport(); }
            if(!document.getElementById("dashboard-view").classList.contains("hidden")) { renderDashboardCharts(); }
        }

        function exportMasterProgramPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4'); let first = true;
            Object.keys(registeredPrograms).forEach(college => {
                const recs = sharedSchedules.filter(s => s.college === college); if (recs.length === 0) return;
                if (!first) doc.addPage(); first = false;
                doc.setFontSize(12); doc.text(`${college} MASTER MATRIX CLASS PROGRAM`, 14, 15);
                docAutoTableShim(doc, { startY: 20, head: [['Section', 'Day/Time', 'Subject', 'Units', 'Instructor', 'Room']], body: recs.map(r => [r.classSection, `${r.dayAssignment}\n${convert24To12Hour(r.startTime)} - ${convert24To12Hour(r.endTime)}`, r.subjectTitle, r.unifiedUnits, r.instructorName, r.roomNumber]), headStyles: { fillColor: getCollegeHexCode(college) } });
            }); doc.save('Master_Class_Program.pdf');
        }

        function exportFacultySummaryPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4'); doc.text("FACULTY LOADING ANALYSIS", 14, 20);
            let dataset = getAggregatedFacultyMetricsList();
            docAutoTableShim(doc, { startY: 25, head: [['Instructor', 'Home College', 'Rank', 'Designation', 'Units', 'Hours']], body: dataset.map(f => [f.name, f.homeCollege, f.rank, f.designation, `${f.units} Unit/s`, `${f.hours.toFixed(1)} Hrs`]) });
            doc.save('Faculty_Load_Summary.pdf');
        }

        function exportProgramSchedulePDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4');
            let filtered = getFilteredSchedules(); if(filtered.length === 0) return;
            let grouped = {}; filtered.forEach(s => { let key = `${s.program}::${s.classSection}::${s.college}`; if(!grouped[key]) grouped[key] = []; grouped[key].push(s); });
            let first = true;
            Object.keys(grouped).forEach(key => {
                let [progName, sectCode, colKey] = key.split("::"); if(!first) doc.addPage(); first = false;
                doc.setFontSize(12); doc.text(`CLASS SCHEDULE REPORT: ${progName} - ${sectCode}`, 14, 15);
                let dataRows = fontFacultyClassesChronologically(grouped[key]).map(r => [r.dayAssignment, `${convert24To12Hour(r.startTime)} - ${convert24To12Hour(r.endTime)}`, r.subjectTitle, r.unifiedUnits, r.instructorName, r.roomNumber]);
                docAutoTableShim(doc, { startY: 22, head: [['Day', 'Time Bracket (12H)', 'Subject Title', 'Unit/s', 'Faculty Instructor', 'Room']], body: dataRows, headStyles: { fillColor: getCollegeHexCode(colKey) } });
            }); doc.save('Class_Schedules_Report.pdf');
        }

        function exportProgramScheduleExcel() {
            let filtered = getFilteredSchedules(); if(filtered.length === 0) return; let wb = XLSX.utils.book_new();
            let grouped = {}; filtered.forEach(s => { let key = `${s.program}::${s.classSection}`; if(!grouped[key]) grouped[key] = []; grouped[key].push(s); });
            Object.keys(grouped).forEach(key => {
                let [progName, sectCode] = key.split("::");
                let sheetRows = [["CLASS INSTRUCTIONAL SCHEDULE REPORT"], [`Profile Blueprint: ${progName} - ${sectCode}`], [], ["Day Assignment", "Time Window", "Subject Description", "Unit/s", "Faculty Instructor", "Room Assignment"]];
                fontFacultyClassesChronologically(grouped[key]).forEach(r => { sheetRows.push([r.dayAssignment, `${convert24To12Hour(r.startTime)}-${convert24To12Hour(r.endTime)}`, r.subjectTitle, r.unifiedUnits, r.instructorName, r.roomNumber]); });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheetRows), `${sectCode}`.replace(/[^a-zA-Z0-9]/g, "").substring(0, 30));
            }); XLSX.writeFile(wb, "University_Class_Schedules.xlsx");
        }

        function clearIngestionConsole() { document.getElementById("rawSchedulePasteInput").value = ""; }

        function convertTo24Hour(t) {
            t = t.trim().toUpperCase(); let pm = t.includes("PM"), am = t.includes("AM"), cl = t.replace("AM","").replace("PM","").trim();
            let [h, m] = cl.split(':').map(Number); m = m || 0; if(!am && !pm && h >= 1 && h < 7) pm = true;
            if (pm && h < 12) h += 12; if (am && h === 12) h = 0;
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        }

        document.getElementById("modalEditForm").addEventListener("submit", function(e) {
            e.preventDefault(); 
            const id = document.getElementById("modalRecordId").value;
            const idx = sharedSchedules.findIndex(s => String(s.id) === String(id)); if(idx === -1) return;
            const selectedProg = document.getElementById("modalProgramSelect").value;
            let resolvedCollegeKey = "COE";
            Object.keys(registeredPrograms).forEach(colKey => { if(registeredPrograms[colKey].includes(selectedProg)) resolvedCollegeKey = colKey; });

            sharedSchedules[idx].program = selectedProg; sharedSchedules[idx].college = resolvedCollegeKey;
            sharedSchedules[idx].classSection = document.getElementById("modalSectionSelect").value;
            sharedSchedules[idx].subjectTitle = document.getElementById("modalSubjectTitle").value;
            sharedSchedules[idx].unifiedUnits = parseInt(document.getElementById("modalUnifiedUnits").value);
            sharedSchedules[idx].dayAssignment = document.getElementById("modalDayAssignment").value;
            sharedSchedules[idx].startTime = document.getElementById("modalStartTime").value;
            sharedSchedules[idx].endTime = document.getElementById("modalEndTime").value;
            sharedSchedules[idx].instructorName = document.getElementById("modalInstructorSelect").value;
            sharedSchedules[idx].roomNumber = document.getElementById("modalRoomSelect").value;
            
            saveSystemStateToLocalStorage(); closeScheduleEditorModal(); executeRegistryDataSynchronization();
        });

        document.getElementById("scheduleForm").addEventListener("submit", function(e) {
            e.preventDefault();
            sharedSchedules.push({
                id: `sched-${Date.now()}`, college: document.getElementById("collegeSelect").value, program: document.getElementById("programSelect").value,
                classSection: document.getElementById("classSectionSelect").value, subjectTitle: document.getElementById("subjectTitle").value,
                unifiedUnits: parseInt(document.getElementById("unifiedUnits").value) || 3, instructorName: document.getElementById("instructorSelect").value,
                dayAssignment: document.getElementById("dayAssignment").value, startTime: document.getElementById("startTime").value,
                endTime: document.getElementById("endTime").value, roomNumber: document.getElementById("roomSelect").value
            });
            this.reset(); saveSystemStateToLocalStorage(); executeRegistryDataSynchronization(); switchTab('schedule-view');
        });

        window.onload = function() { initializeSystemStateHydration(); executeRegistryDataSynchronization(); switchTab('dashboard-view'); };
    </script>
